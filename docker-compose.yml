services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - gestion_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: gestion_auth
    environment:
      ConnectionStrings__DefaultConnection: ${AUTH_DB_CONNECTION}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestion_net

  clientes-pedidos-service:
    build:
      context: ./clientes-pedidos-service
      dockerfile: Dockerfile
    container_name: gestion_clientes_pedidos
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      APP_ENV: ${APP_ENV}
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestion_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_frontend
    ports:
      - "4200:80"
    depends_on:
      - auth-service
      - clientes-pedidos-service
    networks:
      - gestion_net

volumes:
  postgres_data:

networks:
  gestion_net:
    driver: bridge
