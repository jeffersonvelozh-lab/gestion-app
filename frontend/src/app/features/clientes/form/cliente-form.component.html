<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">{{ isEdit ? 'Editar Cliente' : 'Nuevo Cliente' }}</h1>
    <button mat-button routerLink="/clientes">
      <mat-icon>arrow_back</mat-icon> Volver
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" />
          <mat-error *ngIf="form.get('nombre')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="telefono" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="direccion" />
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/clientes">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading || form.invalid">
            {{ isEdit ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
