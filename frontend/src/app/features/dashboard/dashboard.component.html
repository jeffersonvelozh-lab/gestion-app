<div class="dashboard-container">
  <h1 class="page-title">Dashboard</h1>

  <div *ngIf="loading" class="loading-center">
    <mat-spinner />
  </div>

  <ng-container *ngIf="!loading && estadisticas as stats">
    <div class="stats-grid">
      <mat-card class="stat-card">
        <mat-card-content>
          <mat-icon color="primary">shopping_cart</mat-icon>
          <div class="stat-value">{{ stats.total_pedidos }}</div>
          <div class="stat-label">Total Pedidos</div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card stat-success">
        <mat-card-content>
          <mat-icon>check_circle</mat-icon>
          <div class="stat-value">{{ stats.completados }}</div>
          <div class="stat-label">Completados</div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card stat-warning">
        <mat-card-content>
          <mat-icon>pending</mat-icon>
          <div class="stat-value">{{ stats.pendientes }}</div>
          <div class="stat-label">Pendientes</div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card stat-info">
        <mat-card-content>
          <mat-icon>people</mat-icon>
          <div class="stat-value">{{ stats.clientes_activos }}</div>
          <div class="stat-label">Clientes Activos</div>
        </mat-card-content>
      </mat-card>
    </div>

    <div class="charts-grid">
      <mat-card>
        <mat-card-header>
          <mat-card-title>Actividad por Día</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            type="line">
          </canvas>
        </mat-card-content>
      </mat-card>

      <mat-card>
        <mat-card-header>
          <mat-card-title>Estado de Pedidos</mat-card-title>
        </mat-card-header>
        <mat-card-content class="chart-center">
          <canvas baseChart
            [data]="doughnutChartData"
            type="doughnut">
          </canvas>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>
</div>
