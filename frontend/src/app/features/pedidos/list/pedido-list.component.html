<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Pedidos</h1>
    <button mat-flat-button color="primary" routerLink="/pedidos/nuevo">
      <mat-icon>add</mat-icon> Nuevo Pedido
    </button>
  </div>

  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="filters" (ngSubmit)="load()" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estado">
            <mat-option value="">Todos</mat-option>
            <mat-option *ngFor="let e of estadoOptions" [value]="e">{{ e | estadoPedido }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Desde</mat-label>
          <input matInput type="date" formControlName="fecha_desde" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Hasta</mat-label>
          <input matInput type="date" formControlName="fecha_hasta" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit">
          <mat-icon>search</mat-icon> Filtrar
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <div *ngIf="loading" class="loading-center"><mat-spinner diameter="40" /></div>

      <table mat-table [dataSource]="pedidos" *ngIf="!loading" class="full-width">
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let p">{{ p.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="cliente">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>
          <td mat-cell *matCellDef="let p">{{ p.cliente_nombre ?? p.cliente_id }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let p">{{ p.total | currency:'USD' }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let p">
            <mat-chip [color]="getEstadoColor(p.estado)" highlighted>
              {{ p.estado | estadoPedido }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let p">{{ p.fecha_pedido | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button color="primary" (click)="edit(p.id)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="accent" (click)="completar(p)" matTooltip="Completar" [disabled]="p.estado !== 'pendiente'"><mat-icon>check_circle</mat-icon></button>
            <button mat-icon-button color="warn" (click)="cancelar(p)" matTooltip="Cancelar" [disabled]="p.estado === 'cancelado'"><mat-icon>cancel</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(p)" matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [length]="total" [pageSize]="perPage" [pageSizeOptions]="[5, 10, 25]" (page)="onPageChange($event)" />
    </mat-card-content>
  </mat-card>
</div>
