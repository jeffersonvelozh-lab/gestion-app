<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">{{ isEdit ? 'Editar Pedido' : 'Nuevo Pedido' }}</h1>
    <button mat-button routerLink="/pedidos">
      <mat-icon>arrow_back</mat-icon> Volver
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Cliente</mat-label>
          <mat-select formControlName="cliente_id">
            <mat-option *ngFor="let c of clientes" [value]="c.id">{{ c.nombre }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('cliente_id')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estado">
            <mat-option *ngFor="let e of estadoOptions" [value]="e">{{ e | estadoPedido }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-col">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="descripcion" rows="3"></textarea>
          <mat-error *ngIf="form.get('descripcion')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Total (USD)</mat-label>
          <input matInput type="number" formControlName="total" min="0" step="0.01" />
          <mat-error *ngIf="form.get('total')?.hasError('min')">Debe ser mayor o igual a 0</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha de pedido</mat-label>
          <input matInput type="date" formControlName="fecha_pedido" />
        </mat-form-field>

        <div class="form-actions full-col">
          <button mat-button type="button" routerLink="/pedidos">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading || form.invalid">
            {{ isEdit ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
